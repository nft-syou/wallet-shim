name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist/shim.js must match src/
        run: git diff --exit-code -- dist/shim.js
      - run: npm test
      - name: CLI smoke (address mode)
        run: node bin/wallet-shim.mjs --address 0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf --chain sepolia --quiet --out shim.out.js
